name: Android experimental APK
on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'native/android/**'
      - 'scripts/prepare-android.mjs'
      # Cover all runtime changes, not documentation-only changes; expire debug artifacts quickly.
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock*'
      - 'vite.config.*'
      - 'docs/ANDROID_RELEASE_CHECKLIST.md'
permissions:
  contents: read
concurrency:
  group: expensescan-android-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK and install required components
        shell: bash
        run: |
          echo "SDK: $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Install web dependencies and verify
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
      - name: Bundle Android web assets
        env:
          VITE_ANDROID_BUILD: 'true'
        run: bun run build
      - name: Generate Android project
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/prepare-android.mjs
      - name: Native JVM regression tests
        working-directory: .android-build/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Warn that this APK is CI-only and not an update
        run: echo "::warning::Ephemeral debug signer. Never uninstall an installed copy to install this APK without a verified external backup. Use owner-signed preview or beta for real device upgrades."
      - name: Build debug APK
        working-directory: .android-build/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Inspect APK and signature
        run: |
          mkdir -p apk-output
          cp .android-build/android/app/build/outputs/apk/debug/app-debug.apk apk-output/ExpenseScan-Android-alpha-${{ github.run_number }}.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose apk-output/*.apk
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging apk-output/*.apk > /tmp/expensescan-badging.txt
          sed -n '1,15p' /tmp/expensescan-badging.txt
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ExpenseScan-Android-alpha-${{ github.run_number }}
          path: apk-output/
          retention-days: 1
          if-no-files-found: error
