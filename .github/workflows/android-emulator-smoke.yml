name: Android emulator smoke
on:
  workflow_dispatch:
  push:
    branches: [android]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'native/android/overlay/app/src/androidTest/**'
      - 'docs/ANDROID_RELEASE_CHECKLIST.md'
      - 'scripts/prepare-android.mjs'
permissions:
  contents: read
concurrency:
  group: expensescan-emulator-smoke
  cancel-in-progress: false
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build offline native bundle
        env:
          VITE_ANDROID_BUILD: 'true'
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build
          node scripts/prepare-android.mjs
      - name: Prepare emulator with Android 35
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          test -n "$sdkmanager_path" && test -x "$sdkmanager_path"
          avdmanager_path="$(dirname "$sdkmanager_path")/avdmanager"
          test -x "$avdmanager_path"
          "$sdkmanager_path" --sdk_root="$sdk_root" "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          export ANDROID_USER_HOME="$RUNNER_TEMP/expensescan-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$avdmanager_path" create avd --force -n ExpenseScanCI -k "system-images;android-35;google_apis;x86_64" -p "$ANDROID_AVD_HOME/ExpenseScanCI.avd"
          test -f "$ANDROID_AVD_HOME/ExpenseScanCI.ini"
          "$sdk_root/emulator/emulator" -list-avds | grep -Fxq ExpenseScanCI
      - name: Boot emulator and run installed-app instrumentation
        working-directory: .android-build/android
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd ExpenseScanCI -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 > /tmp/expensescan-emulator.log 2>&1 &
          trap 'adb emu kill >/dev/null 2>&1 || true; tail -n 40 /tmp/expensescan-emulator.log || true' EXIT
          emulator_pid=$!
          adb start-server
          # Fail immediately if emulator exits rather than waiting on an absent device.
          for i in $(seq 1 180); do
            kill -0 "$emulator_pid" 2>/dev/null || { echo "Emulator exited before adb connected"; exit 1; }
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then break; fi
            sleep 2
          done
          adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82
          adb shell settings put global airplane_mode_on 1
          adb shell cmd connectivity airplane-mode enable
          adb shell svc wifi disable
          adb shell svc data disable
          chmod +x gradlew
          ./gradlew --no-daemon :app:connectedDebugAndroidTest
          # No APK or report artifacts uploaded; this job is intentionally opt-in on test changes.
